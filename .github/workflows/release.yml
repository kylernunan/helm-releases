# Builds Ebbwater Helm from the private source repo (kylernunan/ew-helm, read via
# a read-only deploy key) and publishes the installers as a release HERE. This
# repository is public so the macOS, Windows and Linux runners cost nothing;
# the source never lands in this repo, only the workflow and the artifacts.
#
# Run it by hand: Actions → release → Run workflow → ref = the ew-helm tag
# (e.g. v0.1.1). Or from a terminal:
#   gh workflow run release.yml -R kylernunan/helm-releases -f ref=v0.1.1
#
# The in-app updater (electron-updater, provider github) reads
# kylernunan/helm-releases, so publishing the draft here is what ships an update.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ew-helm tag or branch to build (e.g. v0.1.1)"
        required: true
        default: main
      channel:
        description: "Build channel"
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  contents: write

env:
  SOURCE_REPO: kylernunan/ew-helm

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Ensure one draft release for the ref
        run: |
          gh release view "${{ inputs.ref }}" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.ref }}" -R "${{ github.repository }}" --draft \
              --title "${REF#v}" --notes "Ebbwater Helm ${REF#v} (${{ inputs.channel }})"
        env:
          REF: ${{ inputs.ref }}

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      OPENCODE_CHANNEL: ${{ inputs.channel }}
      # No signing identity yet: build unsigned instead of failing the mac job.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out ew-helm (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: kylernunan/ew-helm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.EW_HELM_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build Helm view bundle
        run: bun run build
        working-directory: packages/helm
      - name: Build web UI (served by --ui / tailnet)
        run: bun run build
        working-directory: packages/app
      # prebuild: icons, metainfo, ripgrep fetch, console compile, sidecar bundle; then electron-vite build
      - name: Build desktop (prebuild + electron-vite)
        run: bun run build
        working-directory: packages/desktop
      - name: Package (no publish; uploaded below to this repo's release)
        run: bun run package -- --${{ matrix.target }} --publish never
        working-directory: packages/desktop
      - name: Upload installers and updater feed to the draft release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.rpm dist/*.blockmap dist/latest*.yml)
          echo "uploading: ${files[*]}"
          gh release upload "${{ inputs.ref }}" "${files[@]}" -R "${{ github.repository }}" --clobber
        working-directory: packages/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: helm-desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
