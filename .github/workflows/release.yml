# Builds Ebbwater Helm from the private source repo (kylernunan/ew-helm, read via
# a read-only deploy key) and publishes the installers as a release HERE. This
# repository is public so the macOS, Windows and Linux runners cost nothing;
# the source never lands in this repo, only the workflow and the artifacts.
#
# Run it by hand: Actions → release → Run workflow → ref = the ew-helm tag
# (e.g. v0.1.1). Or from a terminal:
#   gh workflow run release.yml -R kylernunan/helm-releases -f ref=v0.1.1
#
# `ref` says WHAT to build, `tag` says what to NAME the release. They are the
# same thing when building from a tag, so `tag` defaults to `ref`. Set it when
# the source tag does not exist yet and you are building from a branch:
#   gh workflow run release.yml -R kylernunan/helm-releases -f ref=main -f tag=v0.1.2
# The updater reads the version from the release tag, so a release named after
# a branch ("main") is not a publishable one.
#
# The in-app updater (electron-updater, provider github) reads
# kylernunan/helm-releases, so publishing the draft here is what ships an update.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "ew-helm tag or branch to build (e.g. v0.1.1)"
        required: true
        default: main
      tag:
        description: "Release tag to publish under. Defaults to ref; set it when building from a branch, e.g. ref=main tag=v0.1.2"
        required: false
        default: ""
      channel:
        description: "Build channel"
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  contents: write

env:
  SOURCE_REPO: kylernunan/ew-helm

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Ensure one draft release for the tag
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "${{ github.repository }}" --draft \
              --title "${TAG#v}" --notes "Ebbwater Helm ${TAG#v} (${{ inputs.channel }}, built from ${{ inputs.ref }})"
        env:
          TAG: ${{ inputs.tag || inputs.ref }}

  build:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      OPENCODE_CHANNEL: ${{ inputs.channel }}
      # No signing identity yet: build unsigned instead of failing the mac job.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Crash reporting. Two independent halves: VITE_SENTRY_DSN makes the
      # shipped app report at all (src/renderer/index.tsx only calls
      # Sentry.init when it is set), and the AUTH_TOKEN/ORG/PROJECT trio
      # makes the build upload sourcemaps so those reports are readable.
      # An unset secret evaluates to an empty string, which the desktop
      # prebuild reports as "no crash reporting" rather than failing the
      # build -- so a release still cuts before these are configured.
      # Sourcemaps are never packaged either way (electron-builder
      # `!**/*.map`); Sentry symbolicates from its own uploaded copy.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # A variable, not a secret: an org slug is not confidential, and as a
      # secret GitHub redacts that string everywhere in the log -- installer
      # filenames came out as `dist/***-desktop-linux-x86_64.AppImage` and
      # `themes/***.json`, which is exactly the readability you want back
      # when a build fails. The `||` keeps this working either way during
      # the migration; drop the secret half once the variable exists and
      # the repository secret is deleted (the masking stops at deletion,
      # not here).
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      # One release name for both halves, and it must be THIS variable.
      # The renderer tags its events with
      # `VITE_SENTRY_RELEASE ?? "desktop@<pkg.version>"`, while the upload
      # names the release `SENTRY_RELEASE ?? VITE_SENTRY_RELEASE`. Setting
      # SENTRY_RELEASE alone would upload maps under "v0.1.7" while events
      # arrived tagged "desktop@0.1.7", so nothing would ever symbolicate
      # and the failure would be invisible -- traces just stay minified.
      # Setting VITE_SENTRY_RELEASE makes both sides read the same string.
      VITE_SENTRY_RELEASE: ${{ inputs.tag || inputs.ref }}
    steps:
      - name: Check out ew-helm (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: kylernunan/ew-helm
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.EW_HELM_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build Helm view bundle
        run: bun run build
        working-directory: packages/helm
      - name: Build web UI (served by --ui / tailnet)
        run: bun run build
        working-directory: packages/app
      # prebuild: icons, metainfo, ripgrep fetch, console compile, sidecar bundle; then electron-vite build
      - name: Build desktop (prebuild + electron-vite)
        run: bun run build
        working-directory: packages/desktop
      - name: Package (no publish; uploaded below to this repo's release)
        run: bun run package -- --${{ matrix.target }} --publish never
        working-directory: packages/desktop
      - name: Upload installers and updater feed to the draft release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/*.rpm dist/*.blockmap dist/latest*.yml)
          echo "uploading: ${files[*]}"
          gh release upload "${{ inputs.tag || inputs.ref }}" "${files[@]}" -R "${{ github.repository }}" --clobber
        working-directory: packages/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: helm-desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
